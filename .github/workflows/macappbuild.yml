name: Build App

on:
  push:
    branches: [ "eoleun" ]
  pull_request:
    branches: [ "eoleun" ]

jobs:
  build:
    name: Build and Export macOS App
    runs-on: macos-13

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Select Xcode 15.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify exportOptions.plist
        run: |
          if [ ! -f "exportOptions.plist" ]; then
            echo "exportOptions.plist not found. Generating default..."
            cat <<EOF > exportOptions.plist
            <?xml version="1.0" encoding="UTF-8"?>
            <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
            <plist version="1.0">
            <dict>
                <key>compileBitcode</key>
                <false/>
                <key>destination</key>
                <string>export</string>
                <key>stripSwiftSymbols</key>
                <true/>
            </dict>
            </plist>
            EOF
          else
            echo "exportOptions.plist found."
          fi

      - name: Build macOS App
        run: |
          xcodebuild clean archive \
            -scheme "DateReminder" \
            -archivePath build/DateReminder.xcarchive \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Export .app File
        run: |
          xcodebuild -exportArchive \
            -archivePath build/DateReminder.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist exportOptions.plist

      - name: Create DMG File
        run: |
          mkdir -p build/dmg
          hdiutil create -volname "DateReminder" \
            -srcfolder build/export/DateReminder.app \
            -ov -format UDZO build/dmg/DateReminder.dmg

      - name: Upload Built App & DMG
        uses: actions/upload-artifact@v3
        with:
          name: DateReminder-macOS
          path: |
            build/export/DateReminder.app
            build/dmg/DateReminder.dmg
